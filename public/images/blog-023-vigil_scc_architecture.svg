<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;JetBrains Mono&quot;, ui-monospace, Consolas, monospace;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vigil SCC architecture diagram</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;JetBrains Mono&quot;, ui-monospace, Consolas, monospace;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An AI agent submits commands through an MCP server into a queue manager, which stores tokens in SQLite and executes approved commands via an SSH registry against remote servers. A human operator reviews and approves, rejects, or injects commands through an operator console UI.</desc>
